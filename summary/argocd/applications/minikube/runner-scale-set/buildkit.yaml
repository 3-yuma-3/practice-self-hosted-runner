apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-buildkit
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        valueFiles:
          - $values/summary/helm/runner-scale-set/environments/minikube.yaml
          - $values/summary/helm/runner-scale-set/runners/buildkit.yaml
    - repoURL: https://github.com/3-yuma-3/practice-self-hosted-runner.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      selfHeal: true
