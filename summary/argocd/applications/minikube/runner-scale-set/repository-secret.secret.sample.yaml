apiVersion: v1
kind: Secret
metadata:
  name: practice-self-hosted-runner-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  # argocdの同期対象のrepoがprivateの場合必要。
  # Fine-grained PATを使用する。
  # 対象repoを選択し、`Contents: Read-only` の permission を付与する。
  type: git
  url: https://github.com/3-yuma-3/practice-self-hosted-runner.git
  username: <GitHub username>
  password: <Argo CD用PAT>
