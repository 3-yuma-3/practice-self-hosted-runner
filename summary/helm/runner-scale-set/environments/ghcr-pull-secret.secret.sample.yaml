apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: arc-runners
type: kubernetes.io/dockerconfigjson
stringData:
  # GHCRがprivateの場合必要。
  # `GitHubのusername:GHCR PAT` をBase64化した値。
  # Classic PAT を使用する。
  # `read:packages` の scope を付与する。
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "auth": "<Base64(username:GHCR_PAT)>"
        }
      }
    }
