#
# An example .markdownlint-cli2.yaml file
# https://github.com/DavidAnson/markdownlint-cli2/blob/341e2a331ba578029e66c2e01183e7a6b5ca9ab4/test/markdownlint-cli2-yaml-example/.markdownlint-cli2.yaml

# Disable some built-in rules
config:
  # https://github.com/markdownlint/markdownlint/blob/cf7e1fc7f63c802a92f1d2f0400aeedb33f21688/docs/RULES.md
  no-trailing-spaces: false # MD009
  line-length: false # MD013 気にしない
  no-inline-html: false  # MD033 折りたたみなどはhtmlを使わざるを得ないため

# Ignore files referenced by .gitignore (only valid at root)
gitignore: true
