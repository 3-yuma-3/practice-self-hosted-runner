githubConfigUrl: "https://github.com/3-yuma-3/practice-self-hosted-runner"
githubConfigSecret: "pre-defined-secret"
runnerScaleSetName: "arc-runner-buildkit"
minRunners: 1
maxRunners: 2
template:
  spec:
    containers:
      - name: runner
        image: "ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690"
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
    imagePullSecrets:
      - name: ghcr-pull-secret
    serviceAccountName: buildx-client
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
