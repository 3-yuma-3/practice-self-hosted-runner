githubConfigUrl: "https://github.com/3-yuma-3/practice-self-hosted-runner"
githubConfigSecret: "pre-defined-secret"
runnerScaleSetName: "arc-runner-setup-node"
minRunners: 0
maxRunners: 2
template:
  spec:
    containers:
      - name: runner
        image: "ghcr.io/3-yuma-3/arc-runner-setup-node:sha-1926fa3"
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
    imagePullSecrets:
      - name: ghcr-pull-secret
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
