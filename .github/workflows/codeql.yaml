---
name: CodeQL

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 6'
      # TODO: actionlint を 上げないと落ちる
      timezone: 'Asia/Tokyo'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze:
    name: Analyze GitHub Actions
    runs-on: arc-runner-basic

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
