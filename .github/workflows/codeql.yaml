---
name: CodeQL

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 6'
      # TODO: actionlint を 上げないと落ちる
      timezone: 'Asia/Tokyo'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze:
    name: Analyze GitHub Actions
    runs-on: arc-runner-basic

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.5
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.5
