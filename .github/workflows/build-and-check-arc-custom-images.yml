---
name: build-custom-arc-images
"on":
  pull_request:  # PRのpreview merge commitで実行
  workflow_dispatch: # 手動実行

permissions:
  contents: read
  packages: read

jobs:
  build-custom-arc-images:
    runs-on: arc-runner-buildkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: kubernetes
          driver-opts: namespace=buildkit,qemu.install=true
          buildkitd-config: summary/arc-custom-images/buildkitd.toml

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: summary/arc-custom-images/docker-bake.hcl
          call: check
          push: false

      # runner nodeの負荷が高過ぎる対策
      # target別に直列で実行。arm64だけbuild。cache使用。
      - name: Build debian image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: summary/arc-custom-images/docker-bake.hcl
          targets: debian
          push: false
          set: |
            debian.platform=linux/arm64
            debian.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/arc-runner-debian:buildcache

      - name: Build setup-node image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: summary/arc-custom-images/docker-bake.hcl
          targets: setup-node
          push: false
          set: |
            setup-node.platform=linux/arm64
            setup-node.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/arc-runner-setup-node:buildcache

      - name: Build setup-python image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: summary/arc-custom-images/docker-bake.hcl
          targets: setup-python
          push: false
          set: |
            setup-node.platform=linux/arm64
            setup-python.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/arc-runner-setup-python:buildcache
