---
name: kubescape-k8s
"on":
  pull_request: # PRのpreview merge commitで実行
  workflow_dispatch: # 手動実行

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  kubescape-k8s:
    runs-on: arc-runner-basic

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # kubescape提供のactionはdocker daemonが必要なので使えない
      - name: Install kubescape kustomize by mise
        uses: jdx/mise-action@v5.3.0
        with:
          install_args: "aqua:kubescape/kubescape kustomize"

      - name: Render k8s manifests
        run: |
          kustomize build summary/k8s/minikube \
            > "$RUNNER_TEMP/k8s-rendered.yaml"

      - name: Scan manifests with kubescape
        run: |
          kubescape scan "$RUNNER_TEMP/k8s-rendered.yaml" \
            --keep-local
