name: buildkit-sample
"on":
  # pull_request: # step04 で bake を導入する前の動作確認に一時的に使用した。その後はPR毎での実行は不要になった。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildkit-sample:
    runs-on: arc-runner-set
    steps:
      - name: Check Docker CLI installed
        run: docker --version

      - name: Set up buildx with the k8s driver
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: kubernetes
          driver-opts: namespace=buildkit

      - name: Check the buildkit builder is ready
        run: docker buildx inspect --bootstrap

      - name: Build custom runner image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:step04/arc-custom-images"
          file: setup-node.Dockerfile
          push: false
