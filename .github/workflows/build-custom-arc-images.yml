---
name: build-custom-arc-images
"on":
  pull_request:  # PRのpreview merge commitで実行
  workflow_dispatch: # 手動実行

permissions:
  contents: read

jobs:
  build-custom-arc-images:
    # runs-on: ubuntu-latest
    runs-on: arc-runner-set
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: kubernetes
          driver-opts: namespace=buildkit,qemu.install=true

      # qemu によって linux/amd64, linux/arm64 両方に対応できるようになっていることを確認する
      - name: Check builder platforms
        run: docker buildx inspect --bootstrap

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: step04/arc-custom-images/docker-bake.hcl
          push: false
