name: Setup Python ARC runner sample

"on":
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  setup-python-sample:
    runs-on: arc-runner-setup-python
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Verify Python
        run: |
          python --version
          python -m pip --version
