---
name: build-and-kubescape-custom-arc-images
"on":
  pull_request:  # PRのpreview merge commitで実行
  workflow_dispatch: # 手動実行

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  build-custom-arc-images:
    runs-on: arc-runner-buildkit
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: kubernetes
          driver-opts: namespace=buildkit,qemu.install=true
          buildkitd-config: summary/arc-custom-images/buildkitd.toml

      - name: Docker build check
        uses: docker/bake-action@v7.5.0
        with:
          files: summary/arc-custom-images/docker-bake.hcl
          call: check
          push: false

      - name: Create image export directory
        run: mkdir -p arc-images

      - name: Docker buildx bake
        uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: |
            summary/arc-custom-images/docker-bake.hcl
            summary/arc-custom-images/docker-bake-export.hcl
          targets: export-images
          push: false

      - name: Upload image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arc-custom-images
          path: arc-images/*.tar
          if-no-files-found: error

  kubescape-custom-arc-images:
    needs: build-custom-arc-images
    runs-on: arc-runner-basic

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # kubescape提供のactionはdocker daemonが必要なので使えない
      - name: Install kubescape by mise
        uses: jdx/mise-action@v5.2.10
        with:
          install_args: "aqua:kubescape/kubescape"

      - name: Download image
        uses: actions/download-artifact@v8.0.2
        with:
          name: arc-custom-images
          path: arc-images

      # docker-archive:arc-images/ubuntu-amd64.tar は除外。 see docker-bake.hcl
      - name: Scan custom images with kubescape
        run: |
          kubescape scan image \
            docker-archive:arc-images/debian-amd64.tar \
            docker-archive:arc-images/debian-arm64.tar \
            docker-archive:arc-images/setup-node-amd64.tar \
            docker-archive:arc-images/setup-node-arm64.tar \
            docker-archive:arc-images/setup-python-amd64.tar \
            docker-archive:arc-images/setup-python-arm64.tar \
            docker-archive:arc-images/ubuntu-arm64.tar \
            --keep-local
