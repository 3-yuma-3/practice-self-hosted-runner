---
name: kubescape-argocd
"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubescape-argocd:
    runs-on: arc-runner-buildkit # arc-runner-basicをdeployしたら切り替える
    # runs-on: arc-runner-basic

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kubescape提供のactionはdocker daemonが必要なので使えない
      - name: Install helm by mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: "aqua:kubescape/kubescape kustomize"

      - name: Render argocd manifests
        run: |
          kustomize build summary/argocd/applications/minikube \
            > "$RUNNER_TEMP/argocd-rendered.yaml"

      - name: Scan manifests with kubescape
        run: |
          kubescape scan "$RUNNER_TEMP/argocd-rendered.yaml" \
            --keep-local
