name: Ubuntu ARC runner sample

"on":
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  # TODO: ubuntu.Dockerfile で build に必要な package を apt-get install しないと動かない
  ubuntu-sample-setup-node:
    runs-on: arc-runner-ubuntu
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Verify node version
        run: node --version

  ubuntu-sample-setup-python:
    runs-on: arc-runner-ubuntu
    steps:
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Verify python version
        run: python --version

  ubuntu-sample-setup-java:
    runs-on: arc-runner-ubuntu
    steps:
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: corretto
          java-version: "25"

      - name: Verify java version
        run: java --version

  ubuntu-sample-setup-go:
    runs-on: arc-runner-ubuntu
    steps:
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27"

      - name: Verify go version
        run: go version

  # TODO: ubuntu.Dockerfile で build に必要な dir を mkidir しないと動かない
  ubuntu-sample-setup-ruby:
    runs-on: arc-runner-ubuntu
    steps:
      - uses: ruby/setup-ruby@v1.344.0
        with:
          ruby-version: "4.0.10"

      - name: Verify ruby version
        run: ruby --version
